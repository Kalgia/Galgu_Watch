<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galgu Watch</title>
<script>document.documentElement.dataset.theme = localStorage.getItem('galgu-theme') || 'light';</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="month-nav">
    <button id="btn-prev" title="이전 달">◀</button>
    <h1 id="month-label">…</h1>
    <button id="btn-next" title="다음 달">▶</button>
    <button id="btn-today">오늘</button>
  </div>
  <div class="top-right">
    <span id="streak" class="streak" hidden></span>
    <span id="month-stats" class="muted"></span>
    <button id="btn-theme" title="테마 전환">🌙</button>
    <button id="btn-settings" title="설정">⚙️</button>
  </div>
</header>

<main>
  <section id="cal-grid" class="cal-grid"></section>

  <section id="day-panel" hidden>
    <div class="day-head">
      <h2 id="day-title"></h2>
      <span id="day-total" class="muted"></span>
      <button id="btn-share">📤 공유</button>
    </div>

    <div class="card">
      <div class="tl-wrap"><div id="timeline"></div></div>
      <div id="tl-labels" class="tl-labels muted"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>스크린샷</h3>
        <span id="shots-count" class="muted"></span>
      </div>
      <div id="gallery" class="gallery"></div>
      <p id="gallery-empty" class="muted small" hidden></p>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>작업일지</h3>
        <span id="note-status" class="muted"></span>
      </div>
      <div class="note-wrap">
        <textarea id="note-edit" spellcheck="false" placeholder="오늘의 작업을 기록하세요…"></textarea>
        <div id="note-preview" class="md"></div>
      </div>
    </div>
  </section>
</main>

<footer class="muted">
  <a href="#" id="open-data">데이터 폴더 열기</a>
</footer>

<div id="settings" class="modal" hidden>
  <div class="modal-box">
    <h3>⚙️ 설정</h3>
    <label><span>자동 캡처 간격 (분)</span><input id="set-interval" type="number" min="1" max="120"></label>
    <label><span>스크린샷 보관 기한 (일, 0 = 무제한)</span><input id="set-retention" type="number" min="0" max="3650"></label>
    <label><span>자리비움 자동 정지 (분)</span><input id="set-idle" type="number" min="1" max="120"></label>
    <label><span>하루 시작 시각</span><select id="set-daystart"></select></label>
    <label><span>캡처 대상</span>
      <select id="set-monitor">
        <option value="primary">주 모니터만</option>
        <option value="all">모든 모니터</option>
      </select></label>
    <label><span>오버레이 투명도</span>
      <span class="range-wrap"><input id="set-opacity" type="range" min="30" max="100"><em id="set-opacity-v"></em></span></label>
    <label><span>일일 목표 (분, 0 = 사용 안 함)</span><input id="set-goal" type="number" min="0" max="1440" step="10"></label>
    <p class="muted small">하루 시작 시각: 새벽 작업을 전날 기록으로 집계하는 기준이에요. 목표를 켜면 달성한 날에 ✓ 표시와 연속 달성(🔥) 카운트가 보여요.</p>
    <h4 class="modal-sub">디스코드 연동</h4>
    <label><span>"작업 중" 상태 실시간 표시</span><input id="set-presence" type="checkbox"></label>
    <label class="stack"><span>웹훅 URL (일지 카드 올릴 채널)</span><input id="set-webhook" type="text" placeholder="https://discord.com/api/webhooks/…"></label>
    <div class="modal-btns">
      <button id="set-save">저장</button>
      <button id="set-close">닫기</button>
    </div>
  </div>
</div>

<div id="share" class="modal" hidden>
  <div class="modal-box">
    <h3>📤 공유용 내보내기</h3>
    <p class="muted small">포함할 스크린샷을 선택하세요. 민감한 화면이 찍힌 캡처는 체크를 해제하면 빠져요.</p>
    <div id="share-shots" class="share-grid"></div>
    <p id="share-empty" class="muted small" hidden>이 날짜에는 스크린샷이 없어요. 일지 내용만 내보냅니다.</p>
    <div class="modal-btns">
      <button id="share-discord-btn">📨 디스코드 채널로 올리기</button>
      <button id="share-card-btn">🖼 카드 저장</button>
      <button id="share-html-btn">🌐 HTML 저장</button>
      <button id="share-close">닫기</button>
    </div>
    <p class="muted small">저장되면 탐색기가 열려요 — 파일을 디스코드·카톡 창에 끌어다 놓으면 끝.</p>
  </div>
</div>

<div id="lightbox" hidden><img id="lightbox-img" alt=""></div>

<script type="module" src="app.js"></script>
</body>
</html>
